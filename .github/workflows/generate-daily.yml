name: Constitution 365 Daily Generator

on:
  schedule:
    - cron: "30 0 * * *"

  workflow_dispatch:
    inputs:
      day:
        description: "Day number (1-365). Leave empty for automatic day."
        required: false
        type: string

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Determine Day
        id: day
        shell: bash
        run: |
          if [ -n "${{ inputs.day }}" ]; then
            DAY="${{ inputs.day }}"
          else
            START_DATE="2026-10-05"
            TODAY=$(TZ=Asia/Kolkata date +%Y-%m-%d)

            START_TS=$(date -d "$START_DATE" +%s)
            TODAY_TS=$(date -d "$TODAY" +%s)

            DAY=$(( (TODAY_TS - START_TS) / 86400 + 1 ))
          fi

          if [ "$DAY" -lt 1 ] || [ "$DAY" -gt 365 ]; then
            echo "Invalid Constitution 365 day: $DAY"
            exit 1
          fi

          echo "Generating Day $DAY"
          echo "day=$DAY" >> "$GITHUB_OUTPUT"

      - name: Generate Daily Constitution Content
        env:
          DAY: ${{ steps.day.outputs.day }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-120b
        run: node generator.js

      - name: Verify Generated JSON
        shell: bash
        run: |
          DAY="${{ steps.day.outputs.day }}"
          FILE="data/day-$(printf '%03d' "$DAY").json"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: Generated file not found: $FILE"
            exit 1
          fi

          node -e "
          const fs=require('fs');
          const f=process.argv[1];
          const x=JSON.parse(fs.readFileSync(f,'utf8'));
          if(Number(x.day)!==Number(process.argv[2])) throw new Error('Day mismatch');
          if(!x.lesson) throw new Error('Missing lesson');
          if(!Array.isArray(x.examples)||x.examples.length<2) throw new Error('Missing examples');
          if(!Array.isArray(x.mcqs)||x.mcqs.length<5) throw new Error('Missing MCQs');
          x.mcqs.forEach((m,i)=>{
            if(!Array.isArray(m.options)||m.options.length!==4) throw new Error('MCQ '+(i+1)+' must have 4 options');
            if(!m.options.includes(m.answer)) throw new Error('MCQ '+(i+1)+' answer mismatch');
            if(!m.explanation) throw new Error('MCQ '+(i+1)+' explanation missing');
          });
          console.log('JSON verification passed:',f);
          " "$FILE" "$DAY"

      - name: Commit Daily JSON
        shell: bash
        run: |
          DAY="${{ steps.day.outputs.day }}"
          FILE="data/day-$(printf '%03d' "$DAY").json"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$FILE"

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Generate Constitution 365 Day $DAY"
          git push
